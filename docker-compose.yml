version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: erp-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: claps_learn_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/claps_learn_erp
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      FRONTEND_URL: http://157.173.97.181:8000
      ENABLE_CRON_JOBS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
    command: sh -c "npm run prisma:generate && npm run prisma:migrate && npm run seed && npm run dev"

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: erp-frontend
    restart: always
    ports:
      - "8000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://157.173.97.181:3001/api
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local

networks:
  default:
    name: erp-network
